<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnzePerfeito — Mercado</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .mercado-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 2rem 0 1.25rem;
    }

    .filtros {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
      background: rgba(15,77,46,0.4);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--raio-grande);
      padding: 1rem 1.25rem;
      margin-bottom: 1.25rem;
    }

    .filtros input[type="text"],
    .filtros select {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--raio);
      color: var(--branco);
      font-family: var(--fonte-corpo);
      font-size: 0.875rem;
      padding: 0.5rem 0.85rem;
      flex: 1;
      min-width: 140px;
    }

    .filtros input[type="text"]:focus,
    .filtros select:focus {
      outline: none;
      border-color: var(--dourado);
    }

    .filtros input::placeholder { color: rgba(245,245,240,0.3); }
    .filtros select option { background: var(--verde-escuro); }

    .saldo-topo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.875rem;
    }

    .tabela-wrapper {
      overflow-x: auto;
      border-radius: var(--raio-grande);
      border: 1px solid rgba(201,168,76,0.15);
    }

    .tabela { min-width: 580px; }

    .tabela td .nome-jogador { font-weight: 500; }
    .tabela td .clube-jogador { font-size: 0.75rem; color: var(--cinzento); }

    .preco-col {
      font-family: var(--fonte-mono);
      font-size: 0.9rem;
      color: var(--dourado);
    }

    .media-col { font-family: var(--fonte-mono); font-size: 0.85rem; }

    .paginacao {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
    }

    .paginacao button {
      background: rgba(15,77,46,0.4);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--raio);
      color: var(--branco);
      font-family: var(--fonte-corpo);
      font-size: 0.85rem;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
      transition: all var(--transicao);
    }

    .paginacao button:hover,
    .paginacao button.ativo { border-color: var(--dourado); color: var(--dourado); }
    .paginacao button:disabled { opacity: 0.3; cursor: not-allowed; }

    .paginacao .info-pagina {
      font-size: 0.8rem;
      color: var(--cinzento);
      font-family: var(--fonte-mono);
    }

    .btn-adicionar {
      padding: 0.35rem 0.8rem;
      font-size: 0.78rem;
    }

    .na-equipa {
      font-size: 0.75rem;
      color: var(--sucesso);
      font-family: var(--fonte-mono);
    }

    .contador-resultados {
      font-size: 0.8rem;
      color: var(--cinzento);
      font-family: var(--fonte-mono);
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="page-content">
    <div class="mercado-header">
      <div>
        <h2>Mercado</h2>
        <p class="text-cinzento text-sm">487 jogadores da Liga Portugal 25/26</p>
      </div>
      <div class="saldo-topo">
        <span class="text-cinzento">Saldo:</span>
        <span class="saldo-display" id="saldo-display">—<span>M€</span></span>
      </div>
    </div>

    <div id="alerta" class="alerta"></div>

    <!-- Filtros -->
    <div class="filtros">
      <input type="text" id="filtro-nome" placeholder="🔍 Procurar jogador..." oninput="aplicarFiltros()" />
      <select id="filtro-posicao" onchange="aplicarFiltros()">
        <option value="">Todas as posições</option>
        <option value="guarda-redes">Guarda-Redes</option>
        <option value="defesa">Defesa</option>
        <option value="medio">Médio</option>
        <option value="avancado">Avançado</option>
      </select>
      <select id="filtro-clube" onchange="aplicarFiltros()">
        <option value="">Todos os clubes</option>
      </select>
      <select id="filtro-ordem" onchange="aplicarFiltros()">
        <option value="nome">Nome A-Z</option>
        <option value="preco-desc">Preço ↓</option>
        <option value="preco-asc">Preço ↑</option>
        <option value="media-desc">Média ↓</option>
      </select>
    </div>

    <p class="contador-resultados" id="contador"></p>

    <!-- Tabela -->
    <div class="tabela-wrapper">
      <table class="tabela">
        <thead>
          <tr>
            <th>Jogador</th>
            <th>Posição</th>
            <th>Preço</th>
            <th>Média</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tabela-corpo">
          <tr><td colspan="5"><div class="loading-centro"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>

    <div class="paginacao" id="paginacao"></div>
  </div>

  <script src="navbar.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    if (!Auth.exigirAutenticacao()) throw new Error();
    Auth.preencherNavbar();

    const utilizadorId = Auth.obterIDdoToken();
    const POR_PAGINA = 20;

    let todosJogadores = [];
    let jogadoresFiltrados = [];
    let equipaAtual = [];
    let saldoAtual = 100;
    let paginaAtual = 1;

    // ── Inicializar ────────────────────────────────────────
    (async () => {
      const [jogadores, equipa] = await Promise.all([
        API.jogadores.listar().catch(() => []),
        API.equipas.obter(utilizadorId).catch(() => ({})),
      ]);

      todosJogadores = jogadores;
      equipaAtual = equipa.jogadores || [];

      // Calcular saldo
      const gasto = equipaAtual.reduce((s, j) => s + (j.preco || 0), 0);
      saldoAtual = Math.max(0, 100 - gasto);
      document.getElementById('saldo-display').innerHTML = `${saldoAtual.toFixed(1)}<span>M€</span>`;

      // Preencher filtro de clubes
      const clubes = [...new Set(jogadores.map(j => j.clube))].sort();
      const sel = document.getElementById('filtro-clube');
      clubes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
      });

      aplicarFiltros();
    })();

    // ── Filtros ────────────────────────────────────────────
    function aplicarFiltros() {
      const nome    = document.getElementById('filtro-nome').value.toLowerCase();
      const posicao = document.getElementById('filtro-posicao').value;
      const clube   = document.getElementById('filtro-clube').value;
      const ordem   = document.getElementById('filtro-ordem').value;

      jogadoresFiltrados = todosJogadores.filter(j => {
        if (nome    && !j.nome.toLowerCase().includes(nome))   return false;
        if (posicao && j.posicao !== posicao)                  return false;
        if (clube   && j.clube !== clube)                      return false;
        return true;
      });

      jogadoresFiltrados.sort((a, b) => {
        if (ordem === 'nome')       return a.nome.localeCompare(b.nome);
        if (ordem === 'preco-desc') return b.preco - a.preco;
        if (ordem === 'preco-asc')  return a.preco - b.preco;
        if (ordem === 'media-desc') return b.media_pontuacao - a.media_pontuacao;
        return 0;
      });

      paginaAtual = 1;
      document.getElementById('contador').textContent =
        `${jogadoresFiltrados.length} jogador${jogadoresFiltrados.length !== 1 ? 'es' : ''} encontrado${jogadoresFiltrados.length !== 1 ? 's' : ''}`;
      renderizar();
    }

    // ── Renderizar tabela ──────────────────────────────────
    function renderizar() {
      const inicio = (paginaAtual - 1) * POR_PAGINA;
      const pagina = jogadoresFiltrados.slice(inicio, inicio + POR_PAGINA);
      const idsEquipa = new Set(equipaAtual.map(j => j.id));

      const tbody = document.getElementById('tabela-corpo');

      if (!pagina.length) {
        tbody.innerHTML = `<tr><td colspan="5"><p class="empty-state" style="text-align:center;padding:2rem;color:var(--cinzento)">Nenhum jogador encontrado.</p></td></tr>`;
        document.getElementById('paginacao').innerHTML = '';
        return;
      }

      tbody.innerHTML = pagina.map(j => {
        const naEquipa = idsEquipa.has(j.id);
        return `
          <tr>
            <td>
              <div class="nome-jogador">${j.nome}</div>
              <div class="clube-jogador">${j.clube}</div>
            </td>
            <td>${API.badgePosicao(j.posicao)}</td>
            <td class="preco-col">${API.formatarPreco(j.preco)}</td>
            <td class="media-col">${API.formatarMedia(j.media_pontuacao)}</td>
            <td>
              ${naEquipa
                ? '<span class="na-equipa">✓ Na equipa</span>'
                : `<button class="btn btn-primario btn-adicionar" onclick="adicionarJogador('${j.id}')">+ Adicionar</button>`
              }
            </td>
          </tr>`;
      }).join('');

      renderizarPaginacao();
    }

    function renderizarPaginacao() {
      const total = Math.ceil(jogadoresFiltrados.length / POR_PAGINA);
      if (total <= 1) { document.getElementById('paginacao').innerHTML = ''; return; }

      let html = `<button onclick="irPagina(${paginaAtual - 1})" ${paginaAtual === 1 ? 'disabled' : ''}>‹</button>`;
      html += `<span class="info-pagina">${paginaAtual} / ${total}</span>`;
      html += `<button onclick="irPagina(${paginaAtual + 1})" ${paginaAtual === total ? 'disabled' : ''}>›</button>`;
      document.getElementById('paginacao').innerHTML = html;
    }

    function irPagina(n) {
      paginaAtual = n;
      renderizar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Adicionar jogador à equipa ─────────────────────────
    async function adicionarJogador(id) {
      if (equipaAtual.length >= 15) {
        API.mostrarAlerta('alerta', 'A tua equipa já tem 15 jogadores (máximo atingido).', 'erro');
        return;
      }

      const jogador = todosJogadores.find(j => j.id === id);
      if (!jogador) return;

      if (jogador.preco > saldoAtual) {
        API.mostrarAlerta('alerta', `Saldo insuficiente. Precisas de ${API.formatarPreco(jogador.preco)} mas tens ${saldoAtual.toFixed(1)}M€.`, 'erro');
        return;
      }

      // Verificar se já está na equipa
      if (equipaAtual.find(j => j.id === id)) {
        API.mostrarAlerta('alerta', 'Este jogador já está na tua equipa.', 'info');
        return;
      }

      equipaAtual.push(jogador);
      saldoAtual -= jogador.preco;

      try {
        await API.equipas.guardar(utilizadorId, equipaAtual);
        document.getElementById('saldo-display').innerHTML = `${saldoAtual.toFixed(1)}<span>M€</span>`;
        API.mostrarAlerta('alerta', `${jogador.nome} adicionado à equipa!`, 'sucesso');
        renderizar();
      } catch (e) {
        // Reverter em caso de erro
        equipaAtual.pop();
        saldoAtual += jogador.preco;
        API.mostrarAlerta('alerta', e.message || 'Erro ao guardar equipa.', 'erro');
      }
    }
  </script>
</body>
</html>
