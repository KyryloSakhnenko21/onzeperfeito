<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnzePerfeito — Ligas</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ligas-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 2rem 0 1.5rem;
    }

    .ligas-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 700px) { .ligas-grid { grid-template-columns: 1fr; } }

    .painel {
      background: rgba(15,77,46,0.4);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--raio-grande);
      padding: 1.5rem;
    }

    .painel-titulo {
      font-family: var(--fonte-display);
      font-size: 1.1rem;
      color: var(--dourado);
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* ── Liga card ───────────────────────────────────────── */
    .liga-card {
      background: rgba(10,46,26,0.5);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: var(--raio);
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: border-color var(--transicao), background var(--transicao);
      cursor: pointer;
    }

    .liga-card:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(10,46,26,0.75);
    }

    .liga-card-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
    }

    .liga-card-info { flex: 1; }

    .liga-nome {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
    }

    .liga-meta {
      font-size: 0.75rem;
      color: var(--cinzento);
      font-family: var(--fonte-mono);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .liga-codigo {
      display: inline-block;
      font-family: var(--fonte-mono);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--dourado);
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      margin-top: 0.4rem;
      cursor: pointer;
      transition: background var(--transicao);
    }

    .liga-codigo:hover { background: rgba(201,168,76,0.2); }
    .liga-codigo::before { content: '🔑 '; font-size: 0.75rem; }

    .btn-ver-liga {
      font-size: 0.75rem;
      color: var(--dourado);
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 4px;
      padding: 0.3rem 0.75rem;
      white-space: nowrap;
      font-family: var(--fonte-mono);
      flex-shrink: 0;
    }

    /* ── Formulários inline ──────────────────────────────── */
    .form-inline {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .form-inline input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: var(--raio);
      color: var(--branco);
      font-family: var(--fonte-corpo);
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
      transition: border-color var(--transicao);
    }

    .form-inline input:focus {
      outline: none;
      border-color: var(--dourado);
    }

    .form-inline input::placeholder { color: rgba(245,245,240,0.3); }

    hr.divider-form {
      border: none;
      border-top: 1px solid rgba(201,168,76,0.15);
      margin: 1.25rem 0;
    }

    .empty-ligas {
      text-align: center;
      padding: 1.5rem;
      color: var(--cinzento);
      font-size: 0.85rem;
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--verde-medio);
      border: 1px solid var(--dourado);
      border-radius: var(--raio);
      padding: 0.75rem 1.25rem;
      color: var(--dourado);
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 999;
      animation: slideIn 0.25s ease;
      display: none;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── Vista de detalhe ────────────────────────────────── */
    #vista-detalhe { display: none; }

    .detalhe-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0 1.5rem;
      flex-wrap: wrap;
    }

    .btn-voltar {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--dourado);
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: var(--raio);
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      font-family: var(--fonte-corpo);
      transition: background var(--transicao);
    }

    .btn-voltar:hover { background: rgba(201,168,76,0.18); }

    .detalhe-titulo-bloco { flex: 1; }
    .detalhe-titulo-bloco h2 { margin-bottom: 0.15rem; }

    /* ── Tabela de classificação ─────────────────────────── */
    .tabela-classificacao {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .tabela-classificacao thead tr {
      background: rgba(201,168,76,0.1);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }

    .tabela-classificacao th {
      padding: 0.65rem 1rem;
      text-align: left;
      font-family: var(--fonte-display);
      font-size: 0.8rem;
      color: var(--dourado);
      letter-spacing: 0.07em;
    }

    .tabela-classificacao th:last-child,
    .tabela-classificacao td:last-child { text-align: right; }

    .tabela-classificacao tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background var(--transicao);
    }

    .tabela-classificacao tbody tr:hover { background: rgba(201,168,76,0.05); }

    .tabela-classificacao tbody tr.linha-minha {
      background: rgba(201,168,76,0.08);
      border-left: 3px solid var(--dourado);
    }

    .tabela-classificacao td { padding: 0.75rem 1rem; vertical-align: middle; }

    .col-pos {
      width: 3rem;
      font-family: var(--fonte-mono);
      font-weight: 700;
      font-size: 1rem;
      color: var(--cinzento);
    }

    .col-pos.top-3 { color: var(--dourado); }

    .col-nome { display: flex; align-items: center; gap: 0.6rem; }

    .badge-eu {
      display: inline-block;
      font-size: 0.65rem;
      font-family: var(--fonte-mono);
      color: var(--verde-escuro);
      background: var(--dourado);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .col-pontos {
      font-family: var(--fonte-mono);
      font-weight: 700;
      font-size: 1rem;
      color: var(--dourado);
      text-align: right;
    }

    .sem-pontuacoes {
      text-align: center;
      padding: 2rem 1rem 1rem;
      color: var(--cinzento);
      font-size: 0.85rem;
    }

    .sem-pontuacoes .icone-grande { font-size: 2.5rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="page-content">
    <div id="alerta" class="alerta"></div>

    <!-- ══ VISTA LISTA (default) ══════════════════════════ -->
    <div id="vista-lista">
      <div class="ligas-header">
        <div>
          <h2>Ligas</h2>
          <p class="text-cinzento text-sm">Compete com outros jogadores</p>
        </div>
      </div>

      <div class="ligas-grid">
        <div>
          <div class="painel" style="margin-bottom:1.25rem;">
            <p class="painel-titulo">🌍 Liga Global</p>
            <div id="liga-global-container">
              <div class="loading-centro"><div class="spinner"></div></div>
            </div>
          </div>

          <div class="painel">
            <p class="painel-titulo">🏆 As Minhas Ligas</p>
            <div id="minhas-ligas-container">
              <div class="loading-centro"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <div>
          <div class="painel">
            <p class="painel-titulo">➕ Criar Liga Privada</p>
            <div class="form-inline">
              <input type="text" id="nova-liga-nome" placeholder="Nome da liga" maxlength="40" />
              <button class="btn btn-primario" id="btn-criar" onclick="criarLiga()">Criar Liga</button>
            </div>

            <hr class="divider-form" />

            <p class="painel-titulo">🔗 Entrar numa Liga</p>
            <div class="form-inline">
              <input type="text" id="codigo-entrada" placeholder="Código de 6 caracteres" maxlength="6"
                     style="text-transform:uppercase;letter-spacing:0.12em;" />
              <button class="btn btn-secundario" id="btn-entrar" onclick="entrarLiga()">Entrar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ VISTA DETALHE ═══════════════════════════════════ -->
    <div id="vista-detalhe">
      <div class="detalhe-header">
        <button class="btn-voltar" onclick="voltarLista()">← Voltar às Ligas</button>
        <div class="detalhe-titulo-bloco">
          <h2 id="detalhe-nome"></h2>
          <p class="text-cinzento text-sm" id="detalhe-meta"></p>
        </div>
      </div>
      <div class="painel">
        <p class="painel-titulo">🏆 Classificação</p>
        <div id="detalhe-tabela">
          <div class="loading-centro"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="navbar.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    if (!Auth.exigirAutenticacao()) throw new Error();
    Auth.preencherNavbar();

    const utilizadorId = Auth.obterIDdoToken();
    const API_BASE = 'https://onzeperfeito-app.azurewebsites.net';

    // Cache de ligas para evitar passar objetos em onclick
    const ligasCache = {};

    // ── Toast ──────────────────────────────────────────────
    function mostrarToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function copiarCodigo(codigo, event) {
      event.stopPropagation(); // não ativa o onclick do card
      navigator.clipboard.writeText(codigo)
        .then(() => mostrarToast('Código ' + codigo + ' copiado!'));
    }

    // ── Jornada atual ──────────────────────────────────────
    function jornadaAtual() {
      const inicio  = new Date('2025-08-10');
      const hoje    = new Date();
      const semanas = Math.floor((hoje - inicio) / (7 * 24 * 60 * 60 * 1000)) + 1;
      return Math.max(1, Math.min(semanas, 34));
    }

    // ── Navegação ──────────────────────────────────────────
    function voltarLista() {
      document.getElementById('vista-detalhe').style.display = 'none';
      document.getElementById('vista-lista').style.display   = 'block';
    }

    // ── Abrir detalhe de liga (recebe ID do cache) ─────────
    async function abrirLiga(ligaId) {
      const liga = ligasCache[ligaId];
      if (!liga) return;

      document.getElementById('vista-lista').style.display   = 'none';
      document.getElementById('vista-detalhe').style.display = 'block';

      document.getElementById('detalhe-nome').textContent = liga.nome || 'Liga';
      const membros = liga.membros || [];
      document.getElementById('detalhe-meta').textContent =
        membros.length + ' participante' + (membros.length !== 1 ? 's' : '');

      const container = document.getElementById('detalhe-tabela');
      container.innerHTML = '<div class="loading-centro"><div class="spinner"></div></div>';

      if (!membros.length) {
        container.innerHTML = '<p class="empty-ligas">Esta liga ainda não tem membros.</p>';
        return;
      }

      try {
        const jAtual  = jornadaAtual();
        const token   = Auth.obterToken();
        const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

        // Buscar equipas de todos os membros e pontuações de todas as jornadas em paralelo
        const jornadas = Array.from({ length: jAtual }, (_, i) => i + 1);

        const [equipasData, pontuacoesData] = await Promise.all([
          Promise.all(membros.map(function(uid) {
            return fetch(API_BASE + '/equipas/?utilizador_id=' + uid, { headers })
              .then(function(r) { return r.ok ? r.json() : null; })
              .catch(function() { return null; });
          })),
          Promise.all(jornadas.map(function(j) {
            return fetch(API_BASE + '/jornadas/pontuacoes?jornada=' + j, { headers })
              .then(function(r) { return r.ok ? r.json() : []; })
              .catch(function() { return []; });
          }))
        ]);

        // Mapa: jogador_id → pontos totais acumulados
        var ptsPorJogador = {};
        for (var ji = 0; ji < pontuacoesData.length; ji++) {
          var lista = Array.isArray(pontuacoesData[ji]) ? pontuacoesData[ji] : [];
          for (var pi = 0; pi < lista.length; pi++) {
            var p = lista[pi];
            if (!p.jogador_id) continue;
            ptsPorJogador[p.jogador_id] = (ptsPorJogador[p.jogador_id] || 0) + Number(p.pontuacao || 0);
          }
        }

        // Calcular pontos de cada membro
        var ranking = membros.map(function(uid, i) {
          var equipa = equipasData[i];
          var nome   = 'Participante ' + (i + 1);
          var pontos = 0;

          if (equipa) {
            nome = equipa.utilizador_nome
                || equipa.nome_utilizador
                || equipa.nome_equipa
                || nome;

            var jogadores = equipa.jogadores || [];
            for (var k = 0; k < jogadores.length; k++) {
              var jid = jogadores[k].id || jogadores[k].jogador_id || jogadores[k]._id;
              pontos += ptsPorJogador[jid] || 0;
            }
          }

          return { uid: uid, nome: nome, pontos: pontos };
        });

        // Ordenar por pontos (decrescente)
        ranking.sort(function(a, b) { return b.pontos - a.pontos; });

        renderizarClassificacao(ranking, container);

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="empty-ligas">Não foi possível carregar a classificação.</p>';
      }
    }

    // ── Renderizar tabela ──────────────────────────────────
    function renderizarClassificacao(ranking, container) {
      var temPontos = ranking.some(function(m) { return m.pontos > 0; });

      var aviso = '';
      if (!temPontos) {
        aviso = '<div class="sem-pontuacoes"><div class="icone-grande">⏳</div>' +
                '<p>Ainda não há jornadas jogadas.<br>As pontuações aparecem aqui após a primeira jornada.</p></div>';
      }

      var html = '<table class="tabela-classificacao"><thead><tr>' +
                 '<th>#</th><th>Equipa / Utilizador</th>' +
                 (temPontos ? '<th>Pontos</th>' : '') +
                 '</tr></thead><tbody>';

      for (var i = 0; i < ranking.length; i++) {
        var m      = ranking[i];
        var pos    = i + 1;
        var euSou  = m.uid === utilizadorId;
        var medalha = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : pos;

        html += '<tr class="' + (euSou ? 'linha-minha' : '') + '">';
        html += '<td class="col-pos ' + (pos <= 3 ? 'top-3' : '') + '">' + medalha + '</td>';
        html += '<td><div class="col-nome">' + m.nome +
                (euSou ? ' <span class="badge-eu">Tu</span>' : '') +
                '</div></td>';
        if (temPontos) {
          html += '<td class="col-pontos">' + m.pontos + ' pts</td>';
        }
        html += '</tr>';
      }

      html += '</tbody></table>';
      container.innerHTML = aviso + html;
    }

    // ── Liga Global ────────────────────────────────────────
    async function carregarLigaGlobal() {
      const container = document.getElementById('liga-global-container');
      try {
        const ligas = await API.ligas.listar('global');
        if (!ligas.length) {
          container.innerHTML = '<p class="empty-ligas">A liga global ainda não foi criada.</p>';
          return;
        }
        const liga = ligas[0];
        const cacheKey = 'global_' + (liga.id || liga._id || '0');
        ligasCache[cacheKey] = liga;

        container.innerHTML =
          '<div class="liga-card" onclick="abrirLiga(\'' + cacheKey + '\')">' +
            '<div class="liga-card-inner">' +
              '<div class="liga-card-info">' +
                '<div class="liga-nome">' + (liga.nome || 'Liga Global OnzePerfeito') + '</div>' +
                '<div class="liga-meta">' +
                  '<span>👥 ' + (liga.membros || []).length + ' participantes</span>' +
                  '<span>Aberta a todos</span>' +
                '</div>' +
              '</div>' +
              '<span class="btn-ver-liga">Ver classificação →</span>' +
            '</div>' +
          '</div>';
      } catch (e) {
        container.innerHTML = '<p class="empty-ligas">Não foi possível carregar a liga global.</p>';
      }
    }

    // ── Minhas ligas privadas ──────────────────────────────
    async function carregarMinhasLigas() {
      const container = document.getElementById('minhas-ligas-container');
      try {
        const ligas = await API.ligas.listarPrivadas();
        const minhas = ligas.filter(function(l) {
          return (l.membros || []).includes(utilizadorId) || l.criador_id === utilizadorId;
        });

        if (!minhas.length) {
          container.innerHTML = '<p class="empty-ligas">Ainda não estás em nenhuma liga privada.<br>Cria uma ou entra com um código.</p>';
          return;
        }

        var html = '';
        for (var i = 0; i < minhas.length; i++) {
          var l = minhas[i];
          var cacheKey = 'priv_' + (l.id || l._id || i);
          ligasCache[cacheKey] = l;

          html +=
            '<div class="liga-card" onclick="abrirLiga(\'' + cacheKey + '\')">' +
              '<div class="liga-card-inner">' +
                '<div class="liga-card-info">' +
                  '<div class="liga-nome">' + l.nome + '</div>' +
                  '<div class="liga-meta">' +
                    '<span>👥 ' + (l.membros || []).length + ' membros</span>' +
                    (l.criador_id === utilizadorId ? '<span style="color:var(--dourado)">Tu criaste</span>' : '') +
                  '</div>' +
                  '<div class="liga-codigo" onclick="copiarCodigo(\'' + l.codigo + '\', event)" title="Clica para copiar">' +
                    l.codigo +
                  '</div>' +
                '</div>' +
                '<span class="btn-ver-liga">Ver classificação →</span>' +
              '</div>' +
            '</div>';
        }
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = '<p class="empty-ligas">Não foi possível carregar as ligas.</p>';
      }
    }

    // ── Criar liga ─────────────────────────────────────────
    async function criarLiga() {
      const nome = document.getElementById('nova-liga-nome').value.trim();
      const btn  = document.getElementById('btn-criar');

      if (!nome) {
        API.mostrarAlerta('alerta', 'Indica um nome para a liga.', 'erro');
        return;
      }

      API.setBotaoCarregando(btn, true);
      try {
        const liga = await API.ligas.criar(nome, utilizadorId);
        document.getElementById('nova-liga-nome').value = '';
        API.mostrarAlerta('alerta', 'Liga "' + liga.nome + '" criada! Código: ' + liga.codigo, 'sucesso');
        mostrarToast('Código da liga: ' + liga.codigo);
        await carregarMinhasLigas();
      } catch (e) {
        API.mostrarAlerta('alerta', e.message || 'Erro ao criar liga.', 'erro');
      } finally {
        API.setBotaoCarregando(btn, false, 'Criar Liga');
      }
    }

    // ── Entrar em liga ─────────────────────────────────────
    async function entrarLiga() {
      const codigo = document.getElementById('codigo-entrada').value.trim().toUpperCase();
      const btn    = document.getElementById('btn-entrar');

      if (codigo.length !== 6) {
        API.mostrarAlerta('alerta', 'O código deve ter exatamente 6 caracteres.', 'erro');
        return;
      }

      API.setBotaoCarregando(btn, true);
      try {
        await API.ligas.entrar(codigo, utilizadorId);
        document.getElementById('codigo-entrada').value = '';
        API.mostrarAlerta('alerta', 'Entraste na liga com sucesso!', 'sucesso');
        await carregarMinhasLigas();
      } catch (e) {
        API.mostrarAlerta('alerta', e.message || 'Código inválido ou liga não encontrada.', 'erro');
      } finally {
        API.setBotaoCarregando(btn, false, 'Entrar');
      }
    }

    // ── Inicializar ────────────────────────────────────────
    carregarLigaGlobal();
    carregarMinhasLigas();
  </script>
</body>
</html>
