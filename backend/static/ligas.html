<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnzePerfeito — Ligas</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .ligas-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin: 2rem 0 1.5rem;
    }
    .ligas-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 700px) { .ligas-grid { grid-template-columns: 1fr; } }
    .painel {
      background: rgba(15,77,46,0.4);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: var(--raio-grande);
      padding: 1.5rem;
    }
    .painel-titulo {
      font-family: var(--fonte-display);
      font-size: 1.1rem;
      color: var(--dourado);
      letter-spacing: 0.06em;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .liga-card {
      background: rgba(10,46,26,0.5);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: var(--raio);
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: border-color var(--transicao);
      cursor: pointer;
    }
    .liga-card:hover { border-color: rgba(201,168,76,0.4); }
    .liga-nome { font-weight: 600; font-size: 0.95rem; margin-bottom: 0.25rem; }
    .liga-meta {
      font-size: 0.75rem;
      color: var(--cinzento);
      font-family: var(--fonte-mono);
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .liga-codigo {
      display: inline-block;
      font-family: var(--fonte-mono);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--dourado);
      background: rgba(201,168,76,0.1);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      margin-top: 0.4rem;
      cursor: pointer;
      transition: background var(--transicao);
    }
    .liga-codigo:hover { background: rgba(201,168,76,0.2); }
    .liga-codigo::before { content: '🔑 '; font-size: 0.75rem; }
    .btn-ver-liga {
      display: inline-block;
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--dourado);
      font-family: var(--fonte-mono);
      opacity: 0.7;
    }
    .form-inline {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .form-inline input {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: var(--raio);
      color: var(--branco);
      font-family: var(--fonte-corpo);
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
      transition: border-color var(--transicao);
    }
    .form-inline input:focus { outline: none; border-color: var(--dourado); }
    .form-inline input::placeholder { color: rgba(245,245,240,0.3); }
    hr.divider-form {
      border: none;
      border-top: 1px solid rgba(201,168,76,0.15);
      margin: 1.25rem 0;
    }
    .empty-ligas {
      text-align: center;
      padding: 1.5rem;
      color: var(--cinzento);
      font-size: 0.85rem;
    }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--verde-medio);
      border: 1px solid var(--dourado);
      border-radius: var(--raio);
      padding: 0.75rem 1.25rem;
      color: var(--dourado);
      font-size: 0.875rem;
      font-weight: 500;
      z-index: 999;
      display: none;
    }

    /* ── Vista detalhe ── */
    #vista-detalhe { display: none; }
    .btn-voltar {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--dourado);
      background: rgba(201,168,76,0.08);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: var(--raio);
      padding: 0.45rem 0.9rem;
      cursor: pointer;
      font-family: var(--fonte-corpo);
    }
    .btn-voltar:hover { background: rgba(201,168,76,0.18); }
    .tabela-classificacao { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .tabela-classificacao thead tr {
      background: rgba(201,168,76,0.1);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }
    .tabela-classificacao th {
      padding: 0.65rem 1rem;
      text-align: left;
      font-family: var(--fonte-display);
      font-size: 0.8rem;
      color: var(--dourado);
      letter-spacing: 0.07em;
    }
    .tabela-classificacao th:last-child,
    .tabela-classificacao td:last-child { text-align: right; }
    .tabela-classificacao tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .tabela-classificacao tbody tr.linha-minha {
      background: rgba(201,168,76,0.08);
      border-left: 3px solid var(--dourado);
    }
    .tabela-classificacao td { padding: 0.75rem 1rem; }
    .badge-eu {
      font-size: 0.65rem;
      font-family: var(--fonte-mono);
      color: var(--verde-escuro);
      background: var(--dourado);
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      font-weight: 700;
      margin-left: 0.4rem;
    }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>

  <div class="page-content">
    <div id="alerta" class="alerta"></div>

    <!-- VISTA LISTA -->
    <div id="vista-lista">
      <div class="ligas-header">
        <div>
          <h2>Ligas</h2>
          <p class="text-cinzento text-sm">Compete com outros jogadores</p>
        </div>
      </div>

      <div class="ligas-grid">
        <div>
          <div class="painel" style="margin-bottom:1.25rem;">
            <p class="painel-titulo">🌍 Liga Global</p>
            <div id="liga-global-container">
              <div class="loading-centro"><div class="spinner"></div></div>
            </div>
          </div>

          <div class="painel">
            <p class="painel-titulo">🏆 As Minhas Ligas</p>
            <div id="minhas-ligas-container">
              <div class="loading-centro"><div class="spinner"></div></div>
            </div>
          </div>
        </div>

        <div>
          <div class="painel">
            <p class="painel-titulo">➕ Criar Liga Privada</p>
            <div class="form-inline">
              <input type="text" id="nova-liga-nome" placeholder="Nome da liga" maxlength="40" />
              <button class="btn btn-primario" id="btn-criar" onclick="criarLiga()">Criar Liga</button>
            </div>
            <hr class="divider-form" />
            <p class="painel-titulo">🔗 Entrar numa Liga</p>
            <div class="form-inline">
              <input type="text" id="codigo-entrada" placeholder="Código de 6 caracteres" maxlength="6"
                     style="text-transform:uppercase;letter-spacing:0.12em;" />
              <button class="btn btn-secundario" id="btn-entrar" onclick="entrarLiga()">Entrar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- VISTA DETALHE -->
    <div id="vista-detalhe">
      <button class="btn-voltar" onclick="voltarLista()">← Voltar às Ligas</button>
      <h2 id="detalhe-nome" style="margin-bottom:0.25rem;"></h2>
      <p class="text-cinzento text-sm" id="detalhe-meta" style="margin-bottom:1.5rem;"></p>
      <div class="painel">
        <p class="painel-titulo">🏆 Classificação</p>
        <div id="detalhe-tabela">
          <div class="loading-centro"><div class="spinner"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="navbar.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    console.log('[ligas] script iniciado');

    if (!Auth.exigirAutenticacao()) throw new Error('Não autenticado');
    Auth.preencherNavbar();

    var utilizadorId = Auth.obterIDdoToken();
    var ligasCache = {};

    console.log('[ligas] utilizadorId:', utilizadorId);

    // ── Utilitários ────────────────────────────────────────
    function mostrarToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(function() { t.style.display = 'none'; }, 3000);
    }

    function copiarCodigo(codigo, event) {
      event.stopPropagation();
      navigator.clipboard.writeText(codigo)
        .then(function() { mostrarToast('Código ' + codigo + ' copiado!'); });
    }

    function voltarLista() {
      document.getElementById('vista-detalhe').style.display = 'none';
      document.getElementById('vista-lista').style.display = 'block';
    }

    function jornadaAtual() {
      var inicio = new Date('2025-08-10');
      var hoje = new Date();
      var semanas = Math.floor((hoje - inicio) / (7 * 24 * 60 * 60 * 1000)) + 1;
      return Math.max(1, Math.min(semanas, 34));
    }

    // ── Clicar numa liga ───────────────────────────────────
    function clicarLiga(cacheKey) {
      console.log('[ligas] clicarLiga:', cacheKey);
      var liga = ligasCache[cacheKey];
      if (!liga) { console.error('[ligas] liga não encontrada no cache:', cacheKey); return; }
      abrirDetalhe(liga);
    }

    // ── Abrir detalhe ──────────────────────────────────────
    function abrirDetalhe(liga) {
      document.getElementById('vista-lista').style.display = 'none';
      document.getElementById('vista-detalhe').style.display = 'block';

      document.getElementById('detalhe-nome').textContent = liga.nome || 'Liga';
      var membros = Array.isArray(liga.membros) ? liga.membros : [];
      document.getElementById('detalhe-meta').textContent =
        membros.length + ' participante' + (membros.length !== 1 ? 's' : '');

      var container = document.getElementById('detalhe-tabela');
      container.innerHTML = '<div class="loading-centro"><div class="spinner"></div></div>';

      if (membros.length === 0) {
        container.innerHTML = '<p class="empty-ligas">Esta liga não tem membros ainda.</p>';
        return;
      }

      carregarClassificacao(liga, membros, container);
    }

    // ── Carregar classificação ─────────────────────────────
    function carregarClassificacao(liga, membros, container) {
      console.log('[ligas] carregarClassificacao, membros:', membros.length);

      var token = Auth.obterToken();
      var headers = {};
      if (token) headers['Authorization'] = 'Bearer ' + token;

      var jAtual = jornadaAtual();
      console.log('[ligas] jornada atual:', jAtual);

      // Buscar equipas
      var promessasEquipas = membros.map(function(uid) {
        return fetch(API_BASE + '/equipas/?utilizador_id=' + uid, { headers: headers })
          .then(function(r) { return r.ok ? r.json() : null; })
          .catch(function(e) { console.warn('[ligas] erro equipa uid=' + uid, e); return null; });
      });

      // Buscar pontuações de todas as jornadas
      var promessasPontuacoes = [];
      for (var j = 1; j <= jAtual; j++) {
        (function(jornada) {
          promessasPontuacoes.push(
            fetch(API_BASE + '/jornadas/pontuacoes?jornada=' + jornada, { headers: headers })
              .then(function(r) { return r.ok ? r.json() : []; })
              .catch(function() { return []; })
          );
        })(j);
      }

      Promise.all([Promise.all(promessasEquipas), Promise.all(promessasPontuacoes)])
        .then(function(resultados) {
          var equipasData = resultados[0];
          var pontuacoesData = resultados[1];

          console.log('[ligas] equipas recebidas:', equipasData.length);
          console.log('[ligas] jornadas recebidas:', pontuacoesData.length);

          // Mapa jogador_id → pontos totais
          var ptsPorJogador = {};
          for (var ji = 0; ji < pontuacoesData.length; ji++) {
            var lista = Array.isArray(pontuacoesData[ji]) ? pontuacoesData[ji] : [];
            for (var pi = 0; pi < lista.length; pi++) {
              var p = lista[pi];
              if (!p || !p.jogador_id) continue;
              ptsPorJogador[p.jogador_id] = (ptsPorJogador[p.jogador_id] || 0) + Number(p.pontuacao || 0);
            }
          }

          // Calcular ranking
          var ranking = membros.map(function(uid, i) {
            var equipa = equipasData[i];
            var nome = 'Participante ' + (i + 1);
            var pontos = 0;

            if (equipa) {
              nome = equipa.utilizador_nome || equipa.nome_utilizador || equipa.nome_equipa || nome;
              var jogadores = Array.isArray(equipa.jogadores) ? equipa.jogadores : [];
              for (var k = 0; k < jogadores.length; k++) {
                var jog = jogadores[k];
                var jid = jog.id || jog.jogador_id || jog._id;
                if (jid) pontos += ptsPorJogador[jid] || 0;
              }
            }

            return { uid: uid, nome: nome, pontos: pontos };
          });

          ranking.sort(function(a, b) { return b.pontos - a.pontos; });
          console.log('[ligas] ranking calculado:', ranking);

          renderizarTabela(ranking, container);
        })
        .catch(function(err) {
          console.error('[ligas] erro na classificação:', err);
          container.innerHTML = '<p class="empty-ligas">Erro ao carregar classificação.</p>';
        });
    }

    // ── Renderizar tabela ──────────────────────────────────
    function renderizarTabela(ranking, container) {
      var temPontos = ranking.some(function(m) { return m.pontos > 0; });

      var html = '<table class="tabela-classificacao"><thead><tr><th>#</th><th>Utilizador</th>';
      if (temPontos) html += '<th>Pontos</th>';
      html += '</tr></thead><tbody>';

      for (var i = 0; i < ranking.length; i++) {
        var m = ranking[i];
        var pos = i + 1;
        var euSou = (m.uid === utilizadorId);
        var medalha = pos === 1 ? '🥇' : pos === 2 ? '🥈' : pos === 3 ? '🥉' : String(pos);

        html += '<tr class="' + (euSou ? 'linha-minha' : '') + '">';
        html += '<td style="font-family:var(--fonte-mono);font-weight:700;' + (pos <= 3 ? 'color:var(--dourado)' : '') + '">' + medalha + '</td>';
        html += '<td>' + m.nome + (euSou ? '<span class="badge-eu">Tu</span>' : '') + '</td>';
        if (temPontos) html += '<td style="font-family:var(--fonte-mono);font-weight:700;color:var(--dourado);text-align:right">' + m.pontos + ' pts</td>';
        html += '</tr>';
      }

      html += '</tbody></table>';
      if (!temPontos) {
        html = '<p class="empty-ligas" style="margin-bottom:1rem">⏳ Ainda não há jornadas jogadas. Lista de participantes:</p>' + html;
      }
      container.innerHTML = html;
    }

    // ── Liga Global ────────────────────────────────────────
    function carregarLigaGlobal() {
      console.log('[ligas] carregarLigaGlobal...');
      var container = document.getElementById('liga-global-container');

      API.ligas.listar('global')
        .then(function(ligas) {
          console.log('[ligas] global recebida:', ligas);
          if (!ligas || !ligas.length) {
            container.innerHTML = '<p class="empty-ligas">A liga global ainda não foi criada.</p>';
            return;
          }
          var liga = ligas[0];
          var key = 'g0';
          ligasCache[key] = liga;

          var membros = Array.isArray(liga.membros) ? liga.membros : [];
          container.innerHTML =
            '<div class="liga-card" id="card-' + key + '">' +
              '<div class="liga-nome">' + (liga.nome || 'Liga Global OnzePerfeito') + '</div>' +
              '<div class="liga-meta">' +
                '<span>👥 ' + membros.length + ' participantes</span>' +
                '<span>Aberta a todos</span>' +
              '</div>' +
              '<div class="btn-ver-liga">Clica para ver a classificação →</div>' +
            '</div>';

          document.getElementById('card-' + key).addEventListener('click', function() {
            clicarLiga(key);
          });
        })
        .catch(function(e) {
          console.error('[ligas] erro global:', e);
          container.innerHTML = '<p class="empty-ligas">Não foi possível carregar a liga global.</p>';
        });
    }

    // ── Minhas ligas ───────────────────────────────────────
    function carregarMinhasLigas() {
      console.log('[ligas] carregarMinhasLigas...');
      var container = document.getElementById('minhas-ligas-container');

      API.ligas.listarPrivadas()
        .then(function(ligas) {
          console.log('[ligas] privadas recebidas:', ligas);
          var minhas = (ligas || []).filter(function(l) {
            var membros = Array.isArray(l.membros) ? l.membros : [];
            return membros.indexOf(utilizadorId) !== -1 || l.criador_id === utilizadorId;
          });

          if (!minhas.length) {
            container.innerHTML = '<p class="empty-ligas">Ainda não estás em nenhuma liga privada.<br>Cria uma ou entra com um código.</p>';
            return;
          }

          container.innerHTML = '';

          minhas.forEach(function(l, i) {
            var key = 'p' + i;
            ligasCache[key] = l;

            var membros = Array.isArray(l.membros) ? l.membros : [];
            var div = document.createElement('div');
            div.className = 'liga-card';
            div.id = 'card-' + key;
            div.innerHTML =
              '<div class="liga-nome">' + l.nome + '</div>' +
              '<div class="liga-meta">' +
                '<span>👥 ' + membros.length + ' membros</span>' +
                (l.criador_id === utilizadorId ? '<span style="color:var(--dourado)">Tu criaste</span>' : '') +
              '</div>' +
              '<div class="liga-codigo" id="cod-' + key + '" title="Clica para copiar">' + l.codigo + '</div>' +
              '<div class="btn-ver-liga">Clica para ver a classificação →</div>';

            container.appendChild(div);

            // Event listener no card (navega para detalhe)
            div.addEventListener('click', function() {
              clicarLiga(key);
            });

            // Event listener no código (copia, não navega)
            var codEl = document.getElementById('cod-' + key);
            if (codEl) {
              codEl.addEventListener('click', function(e) {
                copiarCodigo(l.codigo, e);
              });
            }
          });
        })
        .catch(function(e) {
          console.error('[ligas] erro privadas:', e);
          container.innerHTML = '<p class="empty-ligas">Não foi possível carregar as ligas.</p>';
        });
    }

    // ── Criar liga ─────────────────────────────────────────
    function criarLiga() {
      var nome = document.getElementById('nova-liga-nome').value.trim();
      var btn  = document.getElementById('btn-criar');

      if (!nome) { API.mostrarAlerta('alerta', 'Indica um nome para a liga.', 'erro'); return; }

      API.setBotaoCarregando(btn, true);
      API.ligas.criar(nome, utilizadorId)
        .then(function(liga) {
          document.getElementById('nova-liga-nome').value = '';
          API.mostrarAlerta('alerta', 'Liga "' + liga.nome + '" criada! Código: ' + liga.codigo, 'sucesso');
          mostrarToast('Código da liga: ' + liga.codigo);
          carregarMinhasLigas();
        })
        .catch(function(e) {
          API.mostrarAlerta('alerta', (e && e.message) || 'Erro ao criar liga.', 'erro');
        })
        .finally(function() {
          API.setBotaoCarregando(btn, false, 'Criar Liga');
        });
    }

    // ── Entrar em liga ─────────────────────────────────────
    function entrarLiga() {
      var codigo = document.getElementById('codigo-entrada').value.trim().toUpperCase();
      var btn    = document.getElementById('btn-entrar');

      if (codigo.length !== 6) {
        API.mostrarAlerta('alerta', 'O código deve ter exatamente 6 caracteres.', 'erro');
        return;
      }

      API.setBotaoCarregando(btn, true);
      API.ligas.entrar(codigo, utilizadorId)
        .then(function() {
          document.getElementById('codigo-entrada').value = '';
          API.mostrarAlerta('alerta', 'Entraste na liga com sucesso!', 'sucesso');
          carregarMinhasLigas();
        })
        .catch(function(e) {
          API.mostrarAlerta('alerta', (e && e.message) || 'Código inválido ou liga não encontrada.', 'erro');
        })
        .finally(function() {
          API.setBotaoCarregando(btn, false, 'Entrar');
        });
    }

    // ── Inicializar ────────────────────────────────────────
    console.log('[ligas] a inicializar...');
    carregarLigaGlobal();
    carregarMinhasLigas();
    console.log('[ligas] chamadas iniciadas');
  </script>
</body>
</html>
